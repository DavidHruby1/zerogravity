name: Bug Report
description: Something isn't working right
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Include the trace ID when one is available. Review diagnostic output locally and
        redact credentials, account identifiers, prompts and tool data before sharing.

        如有跟踪 ID，请一并提供。分享前请移除凭据、账户标识、提示词和工具数据。

  - type: textarea
    id: description
    attributes:
      label: What happened? / 发生了什么？
      description: Describe what went wrong and what you expected.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce / 如何复现
      description: |
        What command or request caused the issue?
        Include the command or steps with secrets replaced by placeholders.
      placeholder: |
        curl -s http://localhost:8741/v1/chat/completions \
          -H "x-api-key: <redacted>" \
          -H "Content-Type: application/json" \
          -d '{"model":"gemini-3-flash","messages":[{"role":"user","content":"..."}]}'
    validations:
      required: true

  - type: textarea
    id: report
    attributes:
      label: Diagnostic Report / 诊断报告
      description: |
        Include the image digest, architecture, backend and client versions. For login
        issues, report the managed account count and whether one is active. For a
        stream failure, include the HTTP status, queue wait if known, time to first
        event, last event, and time to completion or disconnect. For retries or
        restarts, include the observed number of upstream attempts and recovery time.
        The local check_proxy.py diagnostics are described in docs/clients.md.
      render: text
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional Context / 补充信息
      description: Anything else -- screenshots, network setup (VPN/proxy), error messages from your client, etc.
